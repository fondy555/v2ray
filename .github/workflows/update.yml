name: Update VLESS List


on:

  schedule:

    # 每6小时执行一次
    - cron: "0 */6 * * *"


  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-24.04


    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      - name: Install dependency
        run: |
          pip install requests


      - name: Generate list
        run: |
          python update.py


      - name: Commit result

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add subscribe.txt


          git commit -m "auto update nodes" || exit 0


          git push
